name: Android APK

# Build the native Ember Android app into an installable APK. The app is
# framework-only (no AndroidX/Gradle dependencies), so it builds with the AOSP
# command-line tools packaged by Ubuntu — no Android Studio and no Google SDK
# download required. The signed debug APK is uploaded as a build artifact.

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install AOSP build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt apksigner zipalign dalvik-exchange

      - name: Build APK
        working-directory: android
        run: bash build-apk.sh

      - name: Show APK info
        working-directory: android
        run: |
          apksigner verify --verbose build/ember-debug.apk || true
          aapt dump badging build/ember-debug.apk | grep -E "^package|launchable|sdkVersion|application-label" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ember-android-apk
          path: android/build/ember-debug.apk
          if-no-files-found: error
